syntax = "proto3";

package video.v1;

import "google/protobuf/timestamp.proto";
import "common.proto";

service VideoService {
    rpc ConfirmVideoUpload (ConfirmVideoUploadRequest) returns (ConfirmVideoUploadResponse);

    rpc GetAllVideosOwner (GetAllVideosOwnerRequest) returns (GetAllVideosOwnerResponse);
    rpc GetPublicVideoBySlug (GetPublicVideoBySlugRequest) returns (GetPublicVideoBySlugResponce);
    rpc GetSettingVideoBySlug (GetSettingVideoBySlugRequest) returns (GetSettingVideoBySlugResponce);
    rpc UpdateSettingsVideo (UpdateSettingsVideoRequest) returns (UpdateSettingsVideoResponse);

    rpc FindAllFilterVideos (FindAllFilterVideosRequest) returns (FindAllFilterVideosResponse);
}

message ConfirmVideoUploadRequest {
  string video_id = 1; 
  string file_key = 2; 
  string content_type = 3; 
  string owner_id = 4;
}

message ConfirmVideoUploadResponse {
  bool success = 1;
}

message GetAllVideosOwnerRequest {
  string owner_id = 1;
  common.v1.FieldMask select_mask = 2;
}

message GetAllVideosOwnerResponse {
  repeated Video videos = 1;
}

message GetPublicVideoBySlugRequest {
  string slug = 1;
  common.v1.FieldMask select_mask = 2;
}

message GetPublicVideoBySlugResponce {
  Video video = 1;
}

message GetSettingVideoBySlugRequest {
  string slug = 1;
  string owner_id= 2; 
  common.v1.FieldMask select_mask = 3;
}

message  GetSettingVideoBySlugResponce{
  Video video =1;
}

message UpdateSettingsVideoRequest {
  string slug = 1;
  string owner_id = 2;
  Video video = 3;
  common.v1.FieldMask update_mask = 4;
  repeated string category_ids = 5;
}

message UpdateSettingsVideoResponse {
  Video video = 1;
}

message FindAllFilterVideosRequest {
  optional int32 take = 1;
  optional int32 skip = 2;
  optional string search_term = 3;
  common.v1.FieldMask select_mask = 4;
}

message FindAllFilterVideosResponse {
  repeated Video videos = 1;
}

message Video {
	string id = 1;
	string owner_id = 2;
  string title = 3;
	optional string description = 4;
  Access access = 5;
  Status status= 6;
  string slug = 7;
  optional string thumbnail_url = 8;
  optional int32 duration_seconds = 9;
  optional string path = 10;
  google.protobuf.Timestamp updated_at = 11;
	google.protobuf.Timestamp created_at = 12;
  repeated VideoCategory categories = 13;
}

message VideoCategory {
  string id = 1;
}

enum Access {
  PUBLIC = 0;
  PRIVATE = 1;
  BYLINK = 2;
}

enum Status {
  PENDING = 0;
  PROCESSING = 1;
  READY = 2;
  FAILED = 3;
}

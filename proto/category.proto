syntax = "proto3";

package category.v1;

import "google/protobuf/timestamp.proto";
import "common.proto";
service CategoryService {
  rpc CheckAvailabilityCategory (CheckAvailabilityCategoryRequest) returns (CheckAvailabilityCategoryResponse);
  rpc CreateCategory (CreateCategoryRequest) returns (CreateCategoryResponse);

  rpc GetAllCategories (GetAllCategoriesRequest) returns (GetAllCategoriesResponse);
  rpc UpdateCategory (UpdateCategoryRequest) returns (UpdateCategoryResponse);
  rpc DeleteCategory (DeleteCategoryRequest) returns (DeleteCategoryResponse);

  rpc GetCategoryWithTranslations (GetCategoryWithTranslationsRequest) returns (GetCategoryWithTranslationsResponse);
}

message CheckAvailabilityCategoryRequest{
    string title = 1;
}

message CheckAvailabilityCategoryResponse {
  bool is_available = 1;
}

message CreateCategoryRequest {
  repeated TargetType targets = 1;
  string thumbnail_url = 2; 
  repeated CreateCategoryTranslation translations = 3;
}

message CreateCategoryResponse {
  Category category = 1;
}

message GetAllCategoriesRequest {
  Language language = 1;
  common.v1.FieldMask select_mask = 2;
}

message GetAllCategoriesResponse {
  repeated Category categories = 1;
}

message UpdateCategoryRequest {
  string slug = 1;
  optional string thumbnail_url = 2;
  repeated TargetType targets = 3;
  repeated CreateCategoryTranslation translations = 4;
}

message UpdateCategoryResponse {
  Category category = 1;
}

message DeleteCategoryRequest {
  string slug = 1;
}

message DeleteCategoryResponse {
  bool status = 1;
}

message GetCategoryWithTranslationsRequest {
  string slug = 1;
  common.v1.FieldMask select_mask = 2;
}

message GetCategoryWithTranslationsResponse {
  Category category = 1;
}
message Category {
  string id = 1;
  string slug = 2;
  string thumbnail_url = 3;
  repeated TargetType targets = 4;
  repeated CategoryTranslation translations = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message CreateCategoryTranslation {
  Language language = 1;
  string title = 2;
  optional string description = 3;
}

message CategoryTranslation {
  string id = 1;
  Language language = 2;
  string title = 3;
  optional string description = 4;
}
enum Language {
  RU = 0;
  EN = 1;
}

enum TargetType {
  VIDEO = 0;
}